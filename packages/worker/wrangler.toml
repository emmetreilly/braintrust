name = "brain-trust-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
ENVIRONMENT = "development"

[[d1_databases]]
binding = "DB"
database_name = "brain-trust-db"
database_id = "local"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "brain-trust-media"

[[durable_objects.bindings]]
name = "CHAT_ROOMS"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_classes = ["ChatRoom"]

# For production, set these via 'wrangler secret put'
# - JWT_SECRET
# Note: AI API keys are stored per-user in the database, not as secrets
