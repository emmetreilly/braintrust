name = "brain-trust-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
ENVIRONMENT = "development"
WORKER_URL = "https://brain-trust-worker.e-caa.workers.dev"
WEB_URL = "https://brain-trust.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "brain-trust-db"
database_id = "db69deb8-d46d-4079-a69a-c67fdaa25255"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "brain-trust-media"

[[durable_objects.bindings]]
name = "CHAT_ROOMS"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

# Vectorize for semantic search (RAG memory)
[[vectorize]]
binding = "VECTORIZE"
index_name = "brain-trust-messages"

# Cloudflare AI for embeddings
[ai]
binding = "AI"

# For production, set these via 'wrangler secret put'
# - JWT_SECRET
# - GOOGLE_CLIENT_ID (for Google OAuth)
# - GOOGLE_CLIENT_SECRET (for Google OAuth)
# - SLACK_CLIENT_ID (for Slack integration)
# - SLACK_CLIENT_SECRET (for Slack integration)
# - SLACK_SIGNING_SECRET (for Slack webhooks)
# - ENCRYPTION_KEY (for encrypting OAuth tokens - generate with: openssl rand -hex 32)
# Note: Embeddings use Cloudflare AI (no external API key needed)
